name: CI

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: apps/game

      - run: npm test
        working-directory: apps/game

      - run: npm run build
        working-directory: apps/game

  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - run: uv sync
        working-directory: apps/server

      - run: uv run pytest
        working-directory: apps/server